name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Load the edge-core deploy key
        uses: ./.github/actions/setup-edge-core
        with:
          ssh-key: ${{ secrets.MONOCLE_EDGE_CORE_SSH_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Compute package
        # Confirms the bundle still compiles to Wasm, so a broken build can't
        # reach the release workflow.
        run: npm run build
