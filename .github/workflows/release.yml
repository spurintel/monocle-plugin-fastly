name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Dependencies install and run here, where nothing can publish: the write
  # token belongs to the job below, which runs no dependency code at all.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Load the edge-core deploy key
        uses: ./.github/actions/setup-edge-core
        with:
          ssh-key: ${{ secrets.MONOCLE_EDGE_CORE_SSH_KEY }}

      - name: Install dependencies
        # No install scripts run while the deploy key is loaded; none are needed.
        run: npm ci --ignore-scripts

      - name: Drop the deploy key
        # Nothing after the install needs it, and everything after runs dependency code.
        run: ssh-agent -k

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Compute package
        # Bundles src/index.ts with esbuild, then compiles to Wasm with
        # js-compute-runtime, producing bin/main.wasm.
        run: npm run build

      - name: Set up the Fastly CLI
        uses: fastly/compute-actions/setup@c2f38daa58a1a6562575c9665f13b080803b8989 # v5

      - name: Package Wasm into a Compute tarball
        # `fastly compute pack` wraps the precompiled Wasm binary into the
        # package tar.gz that the deploy API (PUT .../package) expects.
        run: fastly compute pack --wasm-binary bin/main.wasm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            bin/main.wasm
            pkg/monocle-plugin-fastly.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      - name: Create GitHub Release and upload package
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            bin/main.wasm
            pkg/monocle-plugin-fastly.tar.gz
          generate_release_notes: true
          # A suffixed tag (v2.0.2-rc.1) is a pre-release, which GitHub never
          # marks as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
