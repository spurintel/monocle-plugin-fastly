# Metadata required by the Fastly CLI to build and deploy the Compute package.
# See https://www.fastly.com/documentation/reference/compute/fastly-toml/
manifest_version = 3
name = "monocle-plugin-fastly"
language = "javascript"
description = "Monocle edge assessment and enforcement for Fastly Compute (edge contract 2)"
authors = ["engineering@spur.us"]

[scripts]
  build = "npm run build"

# Viceroy configuration for `fastly compute serve`. Production values are provisioned by the
# dashboard through the Fastly API: the backends, and the stores as resource links.
[local_server]
  [local_server.backends]
    [local_server.backends.origin]
      url = "https://example.com"
      override_host = "example.com"
    [local_server.backends.monocle_policy]
      url = "https://decrypt.mcl.spur.us"
    [local_server.backends.crawler_developers_google_com]
      url = "https://developers.google.com"
    [local_server.backends.crawler_www_bing_com]
      url = "https://www.bing.com"

  [local_server.config_stores]
    [local_server.config_stores.monocle_config]
      format = "inline-toml"
    [local_server.config_stores.monocle_config.contents]
      v = "2"
      id = "local-deployment"
      cv = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      cfgn = "1"
      "cfg.0" = '{"hosts":["example.com"],"assess":["/*"]}'
      enfn = "1"
      "enf.0" = '{"v":1,"p":{"/api/cart/add":1},"s":{"/members":1}}'
      x = '["/static/*"]'
      PUBLISHABLE_KEY = "test_publishable_key"

  [local_server.secret_stores]
    [[local_server.secret_stores.monocle_secrets]]
      key = "SECRET_KEY"
      data = "test_secret_key"
    [[local_server.secret_stores.monocle_secrets]]
      key = "COOKIE_SECRET_VALUE"
      data = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
